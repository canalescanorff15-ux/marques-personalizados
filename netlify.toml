# Merlin Encantos em Papel — Netlify / OpenNext
# O Next.js atual é híbrido (SSR + Route Handlers + APIs) e NÃO deve ser exportado como site estático.
[build]
  command = "npm run check:netlify && npm run check:env -- --production && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22.23.2"
  NETLIFY_NEXT_SKEW_PROTECTION = "true"

# Não adicione rewrite global /* -> /index.html: ele quebraria o runtime Next.js/OpenNext.
