<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#fff7f2">
  <title>Merlin — você está offline</title>
  <style>
    :root{color-scheme:light;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fff7f2;color:#4b342e}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 10%,#f7d4d5 0,transparent 34%),#fff7f2}
    main{width:min(100%,560px);padding:38px 30px;border:1px solid rgba(120,77,67,.18);border-radius:28px;background:rgba(255,250,246,.94);box-shadow:0 22px 60px rgba(91,55,48,.12);text-align:center}
    .mark{width:74px;height:74px;margin:0 auto 20px;border-radius:22px;display:grid;place-items:center;background:#f7d4d5;font-family:Georgia,serif;font-size:38px;font-weight:700;color:#352724}
    h1{margin:0 0 12px;font-family:Georgia,"Times New Roman",serif;font-size:clamp(30px,7vw,46px);line-height:1.03;color:#352724}
    p{margin:0 auto 24px;max-width:42ch;line-height:1.65;color:#70554d}
    a{display:inline-flex;min-height:48px;align-items:center;justify-content:center;padding:0 22px;border-radius:999px;background:#6e4038;color:#fff;text-decoration:none;font-weight:700}
    small{display:block;margin-top:22px;color:#947a72}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">M</div>
    <h1>Sem conexão por enquanto.</h1>
    <p>O catálogo precisa da internet para mostrar preços, disponibilidade e informações sempre atualizadas. Assim que a conexão voltar, tente novamente.</p>
    <a href="/">Tentar novamente</a>
    <small>Merlin — Encantos em Papel</small>
  </main>
</body>
</html>
