name: Verify V6.86 production
permissions:
  contents: read
on:
  pull_request:
    branches: [main]
jobs:
  verify:
    if: github.event.pull_request.number == 37
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read production health
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 4 --retry-delay 3 \
            https://merlin-encantos-em-papel.netlify.app/api/health | tee /tmp/health.json
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));console.log(JSON.stringify({ok:d.ok,mode:d.mode,release:d.release,database:d.database,schema:d.schema,integrity:d.integrity},null,2));if(d.ok!==true)process.exit(1)"
