name: Lighthouse diagnostic
permissions:
  contents: read
on:
  pull_request:
    branches: [main]
concurrency:
  group: lighthouse-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  inspect:
    if: github.event.pull_request.number == 36
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Inspect Best Practices report
        run: node scripts/lighthouse-preview-diagnostic.mjs
