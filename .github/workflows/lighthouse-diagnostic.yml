name: Lighthouse diagnostic
permissions:
  contents: read
on:
  pull_request:
    branches: [main]
concurrency:
  group: lighthouse-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  inspect:
    if: github.event.pull_request.number == 36
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Run Lighthouse 9 on production
        run: |
          npx -y lighthouse@9.6.8 \
            https://merlin-encantos-em-papel.netlify.app/ \
            --output=json \
            --output-path=/tmp/lhr.json \
            --only-categories=best-practices \
            --chrome-flags="--headless --no-sandbox --disable-gpu"
      - name: Print failing weighted audits
        run: |
          node --input-type=module -e "import fs from 'node:fs';const l=JSON.parse(fs.readFileSync('/tmp/lhr.json','utf8'));const c=l.categories['best-practices'];console.log('Lighthouse',l.lighthouseVersion,'score',Math.round(c.score*100));for(const r of c.auditRefs){const a=l.audits[r.id];if(r.weight>0&&a&&a.score!==1)console.log(JSON.stringify({id:r.id,weight:r.weight,score:a.score,title:a.title,displayValue:a.displayValue||null,detailsType:a.details?.type||null,items:a.details?.items?.slice?.(0,5)||null}));}"
