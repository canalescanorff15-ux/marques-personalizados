name: Generate package lock
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    branches:
      - merlin-v821-live
    paths:
      - package.json
      - .github/workflows/generate-lockfile.yml
jobs:
  lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Generate package-lock.json
        run: npm install --package-lock-only --ignore-scripts --no-fund --no-audit
      - name: Validate dependency contract
        run: npm run check:runtime -- --require-lock
      - name: Prove generated lock installs without lifecycle scripts
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Validate installed dependency tree
        run: npm run check:deps
      - name: Audit generated dependency tree
        run: npm audit --audit-level=high
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json já está atualizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh secure package lock"
          git push origin HEAD:merlin-v821-live
      - name: Generate lockfile checksum
        run: sha256sum package-lock.json > package-lock.sha256
      - name: Upload lockfile artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-lock
          path: |
            package-lock.json
            package-lock.sha256
          if-no-files-found: error
          retention-days: 7
