name: V6.71.1 Docs Sync

on:
  push:
    branches:
      - v6-71-1-release-observability
    paths:
      - '.github/workflows/v6711-doc-sync.yml'

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: v6-71-1-release-observability
          fetch-depth: 0
      - name: Prepend current operational release sections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          docs = {
            'README.md': '''## V6.71 — Netlify production, catálogo público e observabilidade de release\n\nA linha operacional atual é **V6.71.1**. O storefront Next.js híbrido está publicado no Netlify, com Neon como banco e storage S3-compatible preparado para Cloudflare R2. O hotfix restaura a rota pública `/catalogo`, e a identidade de release passa a usar a versão do `package.json` com fallback automático para `COMMIT_REF` do Netlify. O **Backup V9 (`marques-catalog-v9`)** permanece o contrato atual de recuperação, com schema runtime **27**. Runtime: Node.js **22.23.2**, npm **10.9.8**. Antes de promoção, execute o CI completo, valide `/api/health` e faça smoke das rotas públicas críticas.\n\n''',
            'CHANGELOG.md': '''### Manutenção V6.71 — Netlify Production + Catalog Route + Release Observability (2026-09-12)\n- publicação híbrida no Netlify validada com Next.js Server Handler, Neon saudável e acesso público sem SSO obrigatório;\n- hotfix adiciona `app/catalogo/page.tsx`, restaurando `/catalogo` em produção sem alterar as rotas individuais de produto;\n- smoke de produção valida Home, catálogo, guia de preços, orçamento, Meu Projeto, Admin, `/api/health` e `/api/catalog`;\n- identidade técnica passa para app **6.71.1** e usa `COMMIT_REF` como fallback do commit real do Netlify;\n- `package-lock.json` e `package-lock.sha256` permanecem sincronizados e reproduzíveis;\n- **Backup V9 (`marques-catalog-v9`)** e schema runtime **27** permanecem vigentes; storage R2 continua opcional até a configuração das credenciais.\n\n''',
            'RELEASE-CHECKLIST.md': '''## V6.71 — checklist operacional atual\n\n- package version obrigatória: `6.71.1`;\n- Node `22.23.2`, npm `10.9.8`, schema runtime 27;\n- validar CI completo, TypeScript, build, E2E HTTP e smoke local antes da promoção;\n- após o deploy, confirmar `/`, `/catalogo`, `/guia-de-precos`, `/orcamento`, `/meu-projeto`, `/admin/login`, `/api/health` e `/api/catalog`;\n- confirmar release em `/api/health` e commit via `APP_RELEASE_COMMIT` ou fallback `COMMIT_REF`;\n- **Backup V9 (`marques-catalog-v9`)** permanece o formato atual de backup/restore;\n- storage S3-compatible/R2 pode permanecer `S3_REQUIRED=0` somente enquanto uploads remotos não forem exigidos.\n\n''',
            'ROLLBACK-RUNBOOK.md': '''## V6.71 — contrato atual de rollback\n\nA operação corrente é **V6.71.1**, schema runtime 27. Em incidente de aplicação, reverta primeiro para o último deploy Netlify conhecido como `ready` e confirme `/api/health` antes de qualquer ação de dados. Não execute restore de banco para corrigir regressão apenas de código. O **Backup V9 (`marques-catalog-v9`)** permanece o formato atual; restore destrutivo exige as salvaguardas e confirmações já descritas neste runbook. O commit publicado deve ser identificado por `APP_RELEASE_COMMIT` ou pelo fallback `COMMIT_REF` do Netlify.\n\n''',
          }

          for filename, prefix in docs.items():
              path = Path(filename)
              current = path.read_text(encoding='utf-8')
              marker = prefix.splitlines()[0]
              if current.startswith(marker):
                  continue
              path.write_text(prefix + current, encoding='utf-8')
          PY
          git diff -- README.md CHANGELOG.md RELEASE-CHECKLIST.md ROLLBACK-RUNBOOK.md
      - name: Commit synchronized documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CHANGELOG.md RELEASE-CHECKLIST.md ROLLBACK-RUNBOOK.md
          if git diff --cached --quiet; then
            echo 'Documentation already synchronized.'
            exit 0
          fi
          git commit -m 'docs: synchronize V6.71.1 operational release'
          git push origin HEAD:v6-71-1-release-observability
