name: V6.71 Staging Validation

on:
  push:
    branches: [v6-71-sync-staging]

permissions:
  contents: write
  issues: read

concurrency:
  group: v671-staging
  cancel-in-progress: true

jobs:
  validate-and-stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: npm

      - name: Reconstruct verified V6.71 patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python <<'PY'
          import base64, hashlib, json, os, urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          url = f'https://api.github.com/repos/{repo}/issues/10/comments?per_page=100'
          req = urllib.request.Request(url, headers={
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          })
          with urllib.request.urlopen(req) as response:
              comments = json.load(response)

          pieces = []
          for comment in sorted(comments, key=lambda c: c['id']):
              body = str(comment.get('body') or '').strip()
              if not body.startswith('CHUNK-') or '\n' not in body:
                  continue
              pieces.append(''.join(body.split('\n', 1)[1].split()))

          if len(pieces) < 10:
              raise SystemExit(f'payload incompleto: apenas {len(pieces)} blocos encontrados')

          raw = base64.b64decode(''.join(pieces), validate=True)
          digest = hashlib.sha256(raw).hexdigest()
          expected = '82981d318cc598270eff063b20cd87898f2816c1ccc6f28d21d11769d0807882'
          print(f'payload: {len(raw)} bytes / sha256={digest} / blocos={len(pieces)}')
          if digest != expected:
              raise SystemExit(f'SHA-256 divergente: esperado {expected}, recebido {digest}')
          open('/tmp/v671-patch.tar.xz', 'wb').write(raw)
          PY

          rm -rf /tmp/v671-patch
          mkdir -p /tmp/v671-patch
          tar -xJf /tmp/v671-patch.tar.xz -C /tmp/v671-patch
          rsync -a /tmp/v671-patch/ ./

          # O workflow temporário não faz parte da release oficial e é removido
          # antes dos contratos de supply-chain e do commit de staging.
          rm -f .github/workflows/v671-staging.yml

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-fund --no-audit

      - name: Validate complete V6.71
        run: npm run verify

      - name: Commit validated staging tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'Nenhuma alteração para promover.'; exit 1; }
          git commit -m 'test: validated V6.71 staging tree'
          git push origin HEAD:v6-71-sync-staging
