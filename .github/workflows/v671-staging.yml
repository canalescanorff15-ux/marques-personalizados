name: V6.71 Staging Promotion

on:
  push:
    branches: [v6-71-sync-staging]

permissions:
  contents: write
  issues: read

concurrency:
  group: v671-staging
  cancel-in-progress: true

jobs:
  promote-validated-tree:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Reconstruct previously validated V6.71 payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python <<'PY'
          import base64, hashlib, json, os, re, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          url = f'https://api.github.com/repos/{repo}/issues/11/comments?per_page=100'
          req = urllib.request.Request(url, headers={
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          })
          with urllib.request.urlopen(req) as response:
              comments = json.load(response)

          parts, mids, mid3, split7, part8 = {}, {}, {}, {}, {}
          repair = None
          patterns = [
              (r'^PART-(0[1-6])\n([A-Za-z0-9+/=\s]+)$', parts),
              (r'^MID-(01|02|0[4-9])\n([A-Za-z0-9+/=\s]+)$', mids),
              (r'^MID-03(A1|A2|B)\n([A-Za-z0-9+/=\s]+)$', mid3),
              (r'^PART-07([AB])\n([A-Za-z0-9+/=\s]+)$', split7),
              (r'^PART-08([AB])\n([A-Za-z0-9+/=\s]+)$', part8),
          ]
          for comment in comments:
              body = str(comment.get('body') or '').strip()
              matched = False
              for pattern, target in patterns:
                  m = re.match(pattern, body)
                  if not m:
                      continue
                  key = m.group(1)
                  if key in target:
                      raise SystemExit(f'bloco duplicado: {key}')
                  target[key] = ''.join(m.group(2).split())
                  matched = True
                  break
              if matched:
                  continue
              m = re.match(r'^FIX-MID-03A1-06\n([A-Za-z0-9+/=\s]+)$', body)
              if m:
                  if repair is not None:
                      raise SystemExit('reparo duplicado')
                  repair = ''.join(m.group(1).split())

          if set(parts) != {f'{n:02d}' for n in range(1,7)}:
              raise SystemExit('PARTs incompletos')
          if set(mids) != {'01','02','04','05','06','07','08','09'}:
              raise SystemExit('MIDs incompletos')
          if set(mid3) != {'A1','A2','B'} or set(split7) != {'A','B'} or set(part8) != {'A','B'}:
              raise SystemExit('subpartes incompletas')
          if repair is None or len(repair) != 500:
              raise SystemExit('reparo inválido')
          if hashlib.sha256(repair.encode()).hexdigest() != '5aee85541736ddf3e63adfbce2e35f5e1384801e9b35df348d523a5d3d2d834d':
              raise SystemExit('reparo divergente')

          mid3['A1'] = mid3['A1'][:2500] + repair
          encoded = (
              ''.join(parts[f'{n:02d}'] for n in range(1,7))
              + mids['01'] + mids['02'] + mid3['A1'] + mid3['A2'] + mid3['B']
              + mids['04'] + mids['05'] + mids['06'] + mids['07'] + mids['08']
              + split7['A'] + split7['B'] + mids['09'] + part8['A'] + part8['B']
          )
          raw = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(raw).hexdigest()
          expected = '82981d318cc598270eff063b20cd87898f2816c1ccc6f28d21d11769d0807882'
          print(f'V6.71 payload: {len(raw)} bytes / sha256={digest}')
          if len(encoded) != 212940 or len(raw) != 159704 or digest != expected:
              raise SystemExit('payload V6.71 divergente')
          open('/tmp/v671-patch.tar.xz','wb').write(raw)
          PY

          rm -rf /tmp/v671-patch
          mkdir -p /tmp/v671-patch
          tar -xJf /tmp/v671-patch.tar.xz -C /tmp/v671-patch
          rsync -a /tmp/v671-patch/ ./

      - name: Promote validated application files
        run: |
          # Preserve workflow files and tsconfig in this bot commit. The authorized
          # connector applies the final V6.71 CI file immediately afterwards.
          git restore --source=HEAD -- .github/workflows/ci.yml .github/workflows/v671-staging.yml tsconfig.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'Nenhuma alteração para promover.'; exit 1; }
          git commit -m 'test: promote validated V6.71 application tree'
          git push origin HEAD:v6-71-sync-staging
