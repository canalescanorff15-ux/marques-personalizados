name: V6.71 Staging Validation

on:
  push:
    branches: [v6-71-sync-staging]

permissions:
  contents: write
  issues: read

concurrency:
  group: v671-staging
  cancel-in-progress: true

jobs:
  validate-and-stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: npm

      - name: Reconstruct verified V6.71 patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python <<'PY'
          import base64, hashlib, json, os, re, urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          issue = 11
          url = f'https://api.github.com/repos/{repo}/issues/{issue}/comments?per_page=100'
          req = urllib.request.Request(url, headers={
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          })
          with urllib.request.urlopen(req) as response:
              comments = json.load(response)

          parts = {}
          mids = {}
          split7 = {}
          mid3 = {}
          part8 = {}

          for comment in comments:
              body = str(comment.get('body') or '').strip()

              # Canonical leading chunks only. Old corrupted PART-08 is intentionally ignored.
              m = re.match(r'^PART-(0[1-6])\n([A-Za-z0-9+/=\s]+)$', body)
              if m:
                  key = m.group(1)
                  if key in parts:
                      raise SystemExit(f'parte duplicada: PART-{key}')
                  parts[key] = ''.join(m.group(2).split())
                  continue

              # Canonical middle chunks except old corrupted MID-03.
              m = re.match(r'^MID-(01|02|0[4-9])\n([A-Za-z0-9+/=\s]+)$', body)
              if m:
                  key = m.group(1)
                  if key in mids:
                      raise SystemExit(f'mid duplicado: MID-{key}')
                  mids[key] = ''.join(m.group(2).split())
                  continue

              m = re.match(r'^MID-03([AB])\n([A-Za-z0-9+/=\s]+)$', body)
              if m:
                  key = m.group(1)
                  if key in mid3:
                      raise SystemExit(f'MID-03{key} duplicado')
                  mid3[key] = ''.join(m.group(2).split())
                  continue

              m = re.match(r'^PART-07([AB])\n([A-Za-z0-9+/=\s]+)$', body)
              if m:
                  key = m.group(1)
                  if key in split7:
                      raise SystemExit(f'PART-07{key} duplicado')
                  split7[key] = ''.join(m.group(2).split())
                  continue

              m = re.match(r'^PART-08([AB])\n([A-Za-z0-9+/=\s]+)$', body)
              if m:
                  key = m.group(1)
                  if key in part8:
                      raise SystemExit(f'PART-08{key} duplicado')
                  part8[key] = ''.join(m.group(2).split())

          expected_parts = {f'{n:02d}' for n in range(1, 7)}
          expected_mids = {'01', '02', '04', '05', '06', '07', '08', '09'}
          if set(parts) != expected_parts:
              raise SystemExit(f'PARTs inválidos: {sorted(parts)}')
          if set(mids) != expected_mids:
              raise SystemExit(f'MIDs inválidos: {sorted(mids)}')
          if set(mid3) != {'A', 'B'}:
              raise SystemExit(f'MID-03 subpartes inválidas: {sorted(mid3)}')
          if set(split7) != {'A', 'B'}:
              raise SystemExit(f'PART-07 subpartes inválidas: {sorted(split7)}')
          if set(part8) != {'A', 'B'}:
              raise SystemExit(f'PART-08 subpartes inválidas: {sorted(part8)}')

          expected_lengths = {f'{n:02d}': 12000 for n in range(1, 7)}
          expected_mid_lengths = {
              '01': 12000,
              '02': 12000,
              '04': 12000,
              '05': 12000,
              '06': 12000,
              '07': 12000,
              '08': 3702,
              '09': 6387,
          }
          expected_mid3_lengths = {'A': 6000, 'B': 6000}
          expected_split7_lengths = {'A': 13308, 'B': 13309}
          expected_part8_lengths = {'A': 10000, 'B': 10234}

          if {k: len(v) for k, v in parts.items()} != expected_lengths:
              raise SystemExit('comprimentos PART-01..06 divergentes')
          if {k: len(v) for k, v in mids.items()} != expected_mid_lengths:
              raise SystemExit('comprimentos MID canônicos divergentes')
          if {k: len(v) for k, v in mid3.items()} != expected_mid3_lengths:
              raise SystemExit('comprimentos MID-03A/B divergentes')
          if {k: len(v) for k, v in split7.items()} != expected_split7_lengths:
              raise SystemExit('comprimentos PART-07A/B divergentes')
          if {k: len(v) for k, v in part8.items()} != expected_part8_lengths:
              raise SystemExit('comprimentos PART-08A/B divergentes')

          expected_hashes = {
              'PART-01': 'e809a626c3d0169a28e9268c7e081e365f1abb2ee3be2e18e3f48f9f27e78733',
              'PART-02': '2a446c621a374156d59776460c293c53b9f730093193edb2c474e951137085df',
              'PART-03': '6dc9291d40c42efe9a093224697494601ec1f441d0bae5712b863b116d3991c7',
              'PART-04': '6ac74c854a74a799da3829174ec1b03092ca918fc2adf0c753087e1e47aac00c',
              'PART-05': '94a31aaf07dd70d7b1cdaf7467a870777b8b7faab8385f9f947d55979472d5f4',
              'PART-06': 'b73ebb8c103185aea21f00e0372ad114adb892517e546b05cc2f2b1cfe14d47a',
              'MID-01': '72eacc76bf870fbc9f29c55dc0453bb08540382b5524c3d7201d7d5a30dc3426',
              'MID-02': '46ea768153d93e6ca408dccd037ce3047623ffad09cacdae3cfdfce653316df0',
              'MID-03A': '6cc5e1a5d26ef76d82a914e872fa696ee4a63b84d94f6f7c6bf9013eca835129',
              'MID-03B': 'f94b702bef6315900e677de91f832bd6c8c8bd030570325c39ed7644457b1222',
              'MID-04': 'db140f7ddceb3144992dce37b50135d7c567a14d3d7168eb7979b4355a10d48b',
              'MID-05': '7326a9d542a3b059596eabb6227c27b3a1c5b2561078100fb30b979f16ce2093',
              'MID-06': '7c38c3bf924f124c965eb29b97d0208369a125c094cf4ae17d14eeb4332be2cf',
              'MID-07': '7bc26c5cfed1227b3b1eb70ca7880e52ecb5690d815caf6b5863bfd5d7464f60',
              'MID-08': 'd9400ce6a3a03d1eb846e18e079de24786ab05f85ff9ab42252e6d1b89132076',
              'PART-07A': '896b32b26828bce08168f43c0ddd1730fa803f22c9301f98747c5b5c765c9473',
              'PART-07B': '3e168675dacdac86efdc74bc4ee5222ab1bcf7cce3f73e2a5987d3985ba49ab8',
              'MID-09': '947617cd3a4dc3aa5aa6ea2be537db7d30d1c65e2b5b09997e99212f2927caca',
              'PART-08A': '5e508f18d5a8abfa8513757776bd4cd224a2e10194571765212cc29c05f928be',
              'PART-08B': '426de1a61339b80a4b7328b3d7281f1ccc97ff54547ac011fa3443730e145e20',
          }

          chunks = {}
          chunks.update({f'PART-{k}': v for k, v in parts.items()})
          chunks.update({f'MID-{k}': v for k, v in mids.items()})
          chunks.update({f'MID-03{k}': v for k, v in mid3.items()})
          chunks.update({f'PART-07{k}': v for k, v in split7.items()})
          chunks.update({f'PART-08{k}': v for k, v in part8.items()})

          for name, expected in expected_hashes.items():
              actual = hashlib.sha256(chunks[name].encode()).hexdigest()
              print(f'{name} sha256={actual}')
              if actual != expected:
                  raise SystemExit(f'{name} divergente: {actual}')

          # Also verify the reassembled canonical chunks that had to be split for transport.
          if hashlib.sha256((mid3['A'] + mid3['B']).encode()).hexdigest() != '14f70fe79374d14b511e4bc42dc6167492a76e468ce55faaea055e3311b0d44b':
              raise SystemExit('MID-03 reconstituído divergente')
          if hashlib.sha256((part8['A'] + part8['B']).encode()).hexdigest() != '88336dadebc308ec508e6e62b3d6e7d9ac581cc2018027e084007e2e43e43973':
              raise SystemExit('PART-08 reconstituído divergente')

          encoded = (
              ''.join(parts[f'{n:02d}'] for n in range(1, 7))
              + mids['01']
              + mids['02']
              + mid3['A'] + mid3['B']
              + mids['04']
              + mids['05']
              + mids['06']
              + mids['07']
              + mids['08']
              + split7['A'] + split7['B']
              + mids['09']
              + part8['A'] + part8['B']
          )

          if len(encoded) != 212940:
              raise SystemExit(f'base64 total inválido: {len(encoded)} != 212940')

          raw = base64.b64decode(encoded, validate=True)
          if len(raw) != 159704:
              raise SystemExit(f'payload inválido: {len(raw)} bytes != 159704')

          digest = hashlib.sha256(raw).hexdigest()
          expected_sha = '82981d318cc598270eff063b20cd87898f2816c1ccc6f28d21d11769d0807882'
          print(f'payload: {len(raw)} bytes / sha256={digest}')
          if digest != expected_sha:
              raise SystemExit(f'SHA-256 divergente: esperado {expected_sha}, recebido {digest}')

          open('/tmp/v671-patch.tar.xz', 'wb').write(raw)
          PY

          rm -rf /tmp/v671-patch
          mkdir -p /tmp/v671-patch
          tar -xJf /tmp/v671-patch.tar.xz -C /tmp/v671-patch
          rsync -a /tmp/v671-patch/ ./

          # This temporary transport/validation workflow must not enter the release tree.
          rm -f .github/workflows/v671-staging.yml

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-fund --no-audit

      - name: Validate complete V6.71
        run: npm run verify

      - name: Commit validated staging tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'Nenhuma alteração para promover.'; exit 1; }
          git commit -m 'test: validated V6.71 staging tree'
          git push origin HEAD:v6-71-sync-staging
