name: V6.71 Staging Validation

on:
  push:
    branches: [v6-71-sync-staging]

permissions:
  contents: write
  issues: read

concurrency:
  group: v671-staging
  cancel-in-progress: true

jobs:
  validate-and-stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: npm

      - name: Reconstruct verified V6.71 patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python <<'PY'
          import base64, hashlib, json, os, re, urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          issue = 11
          url = f'https://api.github.com/repos/{repo}/issues/{issue}/comments?per_page=100'
          req = urllib.request.Request(url, headers={
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          })
          with urllib.request.urlopen(req) as response:
              comments = json.load(response)

          parts = {}
          mids = {}
          split7 = {}
          for comment in comments:
              body = str(comment.get('body') or '').strip()

              m = re.match(r'^PART-(0[1-6]|08)\n([A-Za-z0-9+/=\s]+)$', body)
              if m:
                  key = m.group(1)
                  if key in parts:
                      raise SystemExit(f'parte duplicada: {key}')
                  parts[key] = ''.join(m.group(2).split())
                  continue

              m = re.match(r'^MID-(0[1-9])\n([A-Za-z0-9+/=\s]+)$', body)
              if m:
                  key = m.group(1)
                  if key in mids:
                      raise SystemExit(f'mid duplicado: {key}')
                  mids[key] = ''.join(m.group(2).split())
                  continue

              m = re.match(r'^PART-07([AB])\n([A-Za-z0-9+/=\s]+)$', body)
              if m:
                  key = m.group(1)
                  if key in split7:
                      raise SystemExit(f'parte 07{key} duplicada')
                  split7[key] = ''.join(m.group(2).split())

          expected_parts = {'01', '02', '03', '04', '05', '06', '08'}
          expected_mids = {f'{n:02d}' for n in range(1, 10)}
          if set(parts) != expected_parts or set(mids) != expected_mids or set(split7) != {'A', 'B'}:
              raise SystemExit(
                  f'partes inválidas: padrão={sorted(parts)}, mids={sorted(mids)}, split7={sorted(split7)}'
              )

          lengths = {k: len(v) for k, v in sorted(parts.items())}
          mid_lengths = {k: len(v) for k, v in sorted(mids.items())}
          split_lengths = {k: len(v) for k, v in sorted(split7.items())}
          print(f'comprimentos padrão={lengths}; mids={mid_lengths}; split7={split_lengths}')

          expected_lengths = {'01':12000,'02':12000,'03':12000,'04':12000,'05':12000,'06':12000,'08':20234}
          expected_mid = {'01':12000,'02':12000,'03':12000,'04':12000,'05':12000,'06':12000,'07':12000,'08':3702,'09':6387}
          expected_split = {'A':13308,'B':13309}
          if lengths != expected_lengths or mid_lengths != expected_mid or split_lengths != expected_split:
              raise SystemExit(
                  f'comprimentos inválidos; esperado padrão={expected_lengths}, mids={expected_mid}, split7={expected_split}'
              )

          encoded = (
              ''.join(parts[f'{n:02d}'] for n in range(1, 7))
              + ''.join(mids[f'{n:02d}'] for n in range(1, 9))
              + split7['A'] + split7['B']
              + mids['09']
              + parts['08']
          )
          if len(encoded) != 212940:
              raise SystemExit(f'base64 total inválido: {len(encoded)} != 212940')

          raw = base64.b64decode(encoded, validate=True)
          if len(raw) != 159704:
              raise SystemExit(f'payload inválido: {len(raw)} bytes != 159704')

          digest = hashlib.sha256(raw).hexdigest()
          expected_sha = '82981d318cc598270eff063b20cd87898f2816c1ccc6f28d21d11769d0807882'
          print(f'payload: {len(raw)} bytes / sha256={digest}')
          if digest != expected_sha:
              raise SystemExit(f'SHA-256 divergente: esperado {expected_sha}, recebido {digest}')
          open('/tmp/v671-patch.tar.xz', 'wb').write(raw)
          PY

          rm -rf /tmp/v671-patch
          mkdir -p /tmp/v671-patch
          tar -xJf /tmp/v671-patch.tar.xz -C /tmp/v671-patch
          rsync -a /tmp/v671-patch/ ./

          # O workflow temporário não integra a release final.
          rm -f .github/workflows/v671-staging.yml

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-fund --no-audit

      - name: Validate complete V6.71
        run: npm run verify

      - name: Commit validated staging tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'Nenhuma alteração para promover.'; exit 1; }
          git commit -m 'test: validated V6.71 staging tree'
          git push origin HEAD:v6-71-sync-staging
