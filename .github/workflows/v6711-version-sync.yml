name: V6.71.1 Version Sync

on:
  push:
    branches:
      - v6-71-1-release-observability
    paths:
      - '.github/workflows/v6711-version-sync.yml'

permissions:
  contents: write

jobs:
  sync-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: v6-71-1-release-observability
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
      - name: Synchronize package version and lock checksum
        shell: bash
        run: |
          set -euo pipefail
          npm version 6.71.1 --no-git-tag-version
          sha256sum package-lock.json > package-lock.sha256
          git diff -- package.json package-lock.json package-lock.sha256
      - name: Commit synchronized metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json package-lock.sha256
          if git diff --cached --quiet; then
            echo 'No metadata changes required.'
            exit 0
          fi
          git commit -m 'chore: synchronize release version to 6.71.1'
          git push origin HEAD:v6-71-1-release-observability
