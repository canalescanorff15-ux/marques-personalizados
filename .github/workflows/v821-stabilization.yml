name: V8.21 Stabilization
permissions:
  contents: read
on:
  pull_request:
    branches: [main]
  push:
    branches: [v821-stabilizacao]
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: V8.21 stabilization contract
        run: node scripts/v821-stabilization-contract-check.mjs
      - name: V8.21 production origin self-test
        run: node --no-warnings --experimental-strip-types scripts/v821-request-origin-self-test.mjs
