name: Finalize Cloudflare Package

permissions:
  contents: write

on:
  push:
    branches: [v6.93-cloudflare-workers]
    paths:
      - .github/workflows/bootstrap-cloudflare.yml

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v6.93-cloudflare-workers
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Synchronize Cloudflare operations docs
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          let runsite=fs.readFileSync('RUNSITE.md','utf8');
          runsite=runsite.replace(
            '> **Nota V6.71:** Runsite passa a ser tratado como plataforma legada/rollback. O caminho recomendado para custo inicial zero é Netlify + Neon + Cloudflare R2, preservando o **Backup V9** e o schema 27. Consulte `NETLIFY.md`.',
            '> **Nota V6.93 (app V6.71.1):** Runsite e Netlify passam a ser plataformas legadas/rollback. A produção principal é **Cloudflare Workers + Neon + Cloudflare R2**, preservando o **Backup V9**, schema 27 e Node `22.23.2`. Consulte `CLOUDFLARE.md`; `NETLIFY.md` fica somente para rollback.'
          );
          fs.writeFileSync('RUNSITE.md',runsite);

          let checklist=fs.readFileSync('RELEASE-CHECKLIST.md','utf8');
          checklist=checklist.replace('## V6.71 — checklist operacional atual','## V6.71 — checklist operacional atual (infra V6.93 Cloudflare Workers)');
          checklist=checklist.replace('- confirmar release em `/api/health` e commit via `APP_RELEASE_COMMIT` ou fallback `COMMIT_REF`;','- confirmar release em `/api/health` e commit via `APP_RELEASE_COMMIT`, fallback de build `WORKERS_CI_COMMIT_SHA` ou `COMMIT_REF` somente no rollback Netlify;');
          if(!checklist.split('\n## ')[0].includes('check:cloudflare')){
            checklist=checklist.replace('- validar CI completo, TypeScript, build, E2E HTTP e smoke local antes da promoção;','- validar CI completo, `npm run check:cloudflare`, TypeScript, build Next, build vinext, dry-run de deploy Workers, E2E HTTP e smoke local antes da promoção;');
          }
          fs.writeFileSync('RELEASE-CHECKLIST.md',checklist);
          NODE
      - name: Commit synchronized docs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RUNSITE.md RELEASE-CHECKLIST.md
          if git diff --cached --quiet; then
            echo 'No docs changes to commit.'
          else
            git commit -m 'V6.93: sincronizar checklist e runbook Cloudflare'
            git push origin HEAD:v6.93-cloudflare-workers
          fi
