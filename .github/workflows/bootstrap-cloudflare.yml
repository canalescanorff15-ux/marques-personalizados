name: Finalize Cloudflare Package

permissions:
  contents: write

on:
  push:
    branches: [v6.93-cloudflare-workers]
    paths:
      - .github/workflows/bootstrap-cloudflare.yml

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v6.93-cloudflare-workers
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Normalize Cloudflare scripts
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file='package.json';
          const pkg=JSON.parse(fs.readFileSync(file,'utf8'));
          pkg.scripts['deploy:vinext']='vinext-cloudflare deploy';
          pkg.scripts['check:cloudflare']='node scripts/cloudflare-workers-contract-check.mjs';
          if(!pkg.scripts.verify.includes('check:cloudflare')){
            pkg.scripts.verify=pkg.scripts.verify.replace('npm run check:netlify','npm run check:cloudflare && npm run check:netlify');
          }
          fs.writeFileSync(file,JSON.stringify(pkg,null,2)+'\n');
          NODE
          npm install --package-lock-only --ignore-scripts --no-fund --no-audit
      - name: Commit normalized package
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'No package changes to commit.'
          else
            git commit -m 'V6.93: normalizar scripts de deploy Cloudflare'
            git push origin HEAD:v6.93-cloudflare-workers
          fi
